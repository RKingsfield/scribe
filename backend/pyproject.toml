[project]
name = "scribe"
version = "0.1.0"
description = "Self-hosted novel-writing app backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "GitPython>=3.1",
  "APScheduler>=3.10",
  "httpx>=0.27",
  "python-frontmatter>=1.1",
  "markdown>=3.5",
  "nh3>=0.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "ruff~=0.16.0",
  "mypy>=1.10",
  "types-PyYAML",
  "types-Markdown",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI Query/Depends in argument defaults is the framework's idiom
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "scribe.*"
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "frontmatter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
