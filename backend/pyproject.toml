[project]
name = "scribe"
version = "0.1.0"
description = "Self-hosted novel-writing app backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "watchdog>=4.0",
  "GitPython>=3.1",
  "APScheduler>=3.10",
  "httpx>=0.27",
  "python-frontmatter>=1.1",
  "markdown>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
